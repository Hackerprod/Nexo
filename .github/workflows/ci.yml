name: ci

# Disabled on push and pull request. Run it by hand from the Actions tab
# (workflow_dispatch) when a cross-platform check is wanted.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain with rustfmt and clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (debug)
        run: cargo test --locked
      - name: Tests (release)
        run: cargo test --locked --release
